; swpod configuration (copied to the game root dir on first install)
[General]
; 1 = hide the real XInput pad from the game (inputs only via the emulated JVS board)
BlockGameXInput=1
ReverseY=0
ReverseThrottle=0

[Keyboard]
; Windows virtual-key codes (decimal). Defaults:
; Test=F2(113) Service=F1(112) Coin=5(53) Start=1(49) Trigger=Space(32)
; Weapon=Ctrl(17) View=V(86) MenuUp=PgUp(33) MenuDown=PgDn(34) Enter=Return(13)
; Joystick = arrow keys, Throttle = W/S
AxisSpeed=16

[XInput]
PadIndex=0
; XInput button masks (decimal); 0 = default. Defaults:
; Coin=Back Start=Start Trigger=A Weapon=B View=Y Enter=X MenuUp/Down=DPad
; Joystick = left stick, Throttle = RT forward / LT brake

[Debug]
Log=1
JvsTrace=0
