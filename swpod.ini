; swpod configuration (copied to the game root dir on first install)
[General]
; 1 = launch the game with -FLATSCREEN (no dome projection warp)
FlatScreen=1
; game language: Setting = operator menu one (default), or force ENG JPN CHN ITA SPA RUS POR IND THA
; (ENG on a Japanese machine makes the game check the HASP serial -> dongle error)
Language=Setting
; 1 = Test key toggles the test switch on/off (cabinet switch is latching)
TestToggle=1
; 1 = hide the real XInput pad from the game (inputs only via the emulated JVS board)
BlockGameXInput=1
ReverseY=0
ReverseThrottle=0

[Keyboard]
; Windows virtual-key codes (decimal). Defaults:
; Test=F2(113) Service=F1(112) Coin=5(53) Start=1(49) Trigger=Space(32)
; Weapon=Ctrl(17) View=V(86) MenuUp=Home(36) MenuDown=End(35) Enter=Return(13)
; Joystick = arrow keys (Up/Down also move the test menu cursor), Throttle = PgUp accelerate / PgDn brake
AxisSpeed=16

[XInput]
PadIndex=0
; XInput button masks (decimal); 0 = default. Defaults:
; Coin=Back Start=Start Trigger=X+RB Weapon=A+LB View=Y Enter=B MenuUp/Down=DPad
; Joystick = left stick (stick down = pitch up)
; Throttle = right stick up / RT accelerate, right stick down / LT brake
ThrottleDeadzone=8689
StickDeadzone=2500

[Debug]
Log=1
JvsTrace=0
